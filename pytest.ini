[pytest]
# Không scan các thư mục này để tránh side-effect khi import
norecursedirs = archive_old_tests node_modules .git .github legacy_wdio test
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] - %(message)s
markers =
    ai_all: Run all 45 AI scenarios continuously on 1 screen without reset
    ai_sales: Tests for Sales and plan recommendations
    ai_compat: Tests for Compatibility and installation
    ai_connection: Tests for Connection issues during travel
    ai_usage: Tests for Usage balance and plans
    ai_cashback: Tests for Cashback and travel bookings
    ai_complaints: Tests for Complaints and difficult conversations
    ai_individual: Run individual AI Agent scenarios
    ai_plan_discovery: Run all 33 Plan Discovery & Account Queries scenarios
    ai_plan_discovery_single: Run individual Plan Discovery queries by ID
    em_6364: Run EM-6364 AI Agent test cases


